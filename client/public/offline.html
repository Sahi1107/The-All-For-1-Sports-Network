<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline · All For 1</title>
  <style>
    html,body{margin:0;height:100%;background:#080808;color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}
    .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
    .brand{font-weight:700;letter-spacing:4px;color:#dbff5a;font-size:14px;margin-bottom:28px;}
    h1{font-size:24px;font-weight:700;margin:0 0 8px;}
    p{color:#9a9a9a;font-size:15px;max-width:32ch;margin:0 0 24px;line-height:1.5;}
    button{background:#dbff5a;color:#080808;border:0;font-weight:600;font-size:14px;
      padding:12px 26px;border-radius:10px;cursor:pointer;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">ALL FOR 1</div>
    <h1>You're offline</h1>
    <p>Check your connection — your feed, profile and tournaments are waiting.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
