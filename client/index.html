<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080808" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AllFor1" />
    <link rel="manifest" href="/manifest.json" />
    <title>All For 1</title>

    <!-- Landing hero display type: Anton (headline) + Saira Condensed (eyebrow/labels). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Saira+Condensed:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- No-flash theme: resolve the saved theme BEFORE first paint so the loading
         screen and app match the user's choice (no dark→light flash for light users). -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('afn-theme') || 'dark';
          var light = p === 'light' || (p === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.dataset.theme = light ? 'light' : 'dark';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', light ? '#f4f5f8' : '#0a0a0a');
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://allfor1.pro/" />
    <meta property="og:title" content="All For 1" />
    <meta property="og:description" content="All For 1 is the verified data layer for Indian grassroots sport — a LinkedIn for athletes to build a verified profile and get discovered by scouts &amp; coaches." />
    <meta property="og:image" content="https://allfor1.pro/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="All For 1" />
    <meta name="twitter:description" content="All For 1 is the verified data layer for Indian grassroots sport — a LinkedIn for athletes to build a verified profile and get discovered by scouts &amp; coaches." />

    <style>
      html, body { margin: 0; padding: 0; background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      html[data-theme="light"], html[data-theme="light"] body { background: #f4f5f8; color: #0d1220; }
      #root:empty::before {
        content: "";
        position: fixed; inset: 0;
        display: block;
        background: #0a0a0a;
      }
      html[data-theme="light"] #root:empty::before { background: #f4f5f8; }
      #root:empty::after {
        content: "";
        position: fixed; top: 50%; left: 50%;
        width: 32px; height: 32px;
        margin: -16px 0 0 -16px;
        border: 2px solid #3b82f6;
        border-top-color: transparent;
        border-radius: 50%;
        animation: af1-spin 0.8s linear infinite;
      }
      @keyframes af1-spin { to { transform: rotate(360deg); } }
      /* Boot overlay for prerendered pages (/, /terms, /privacy, /challenges): their
         #root is non-empty (SEO copy for crawlers), so #root:empty can't cover it.
         This mirrors that loader and sits on top; React clears #root on mount, removing
         both the overlay and the SEO copy together — so users never see the raw text. */
      .app-boot { position: fixed; inset: 0; z-index: 2147483000; background: #0a0a0a; }
      html[data-theme="light"] .app-boot { background: #f4f5f8; }
      .app-boot::after {
        content: "";
        position: fixed; top: 50%; left: 50%;
        width: 32px; height: 32px;
        margin: -16px 0 0 -16px;
        border: 2px solid #3b82f6;
        border-top-color: transparent;
        border-radius: 50%;
        animation: af1-spin 0.8s linear infinite;
      }
      #af1-nojs { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div id="af1-nojs">
        <div>
          <h1 style="font-size:20px;margin:0 0 8px;">All For 1</h1>
          <p style="opacity:.7;margin:0;">JavaScript is required. Open this link in your default browser (Safari or Chrome).</p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
