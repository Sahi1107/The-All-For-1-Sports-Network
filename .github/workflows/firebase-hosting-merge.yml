# Deploys client/ to Firebase Hosting on push to main.
#
# Target: the `allfor1-prod` Hosting site in project allfor1-prod — this is what
# the custom domain allfor1.pro now serves. Auth is keyless Workload Identity
# Federation (the org blocks downloadable SA keys). Uses the repo's own
# SSR-aware firebase.json (the /athletes, /og, /s → Cloud Run rewrites), so a
# deploy never drops the SSR routing.
#
# Required GitHub repo VARIABLES (Settings ▸ Secrets and variables ▸ Actions ▸ Variables):
#   GCP_WIF_PROVIDER = projects/857208844426/locations/global/workloadIdentityPools/github-actions/providers/github
#   GCP_DEPLOY_SA    = gh-deployer@allfor1-prod.iam.gserviceaccount.com
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  # Manual one-click re-deploy from the Actions tab (no empty commit needed) —
  # e.g. when a push event didn't fire a run, or to re-run after a cache flush.
  workflow_dispatch:
permissions:
  contents: read
  id-token: write   # required for the WIF OIDC token
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd client && npm install && npm run build
      # Stamp the deployed commit so "what client is live?" is a 5-second curl of
      # https://allfor1.pro/version.json (this incident was a STALE CLIENT, which
      # the server's /api/version can't reveal). Served no-cache via firebase.json.
      - name: Stamp deployed version
        run: echo "{\"sha\":\"${{ github.sha }}\",\"ref\":\"${{ github.ref_name }}\",\"builtAt\":\"$(date -u +%FT%TZ)\"}" > client/dist/version.json
      - uses: google-github-actions/auth@v2
        with:
          project_id: allfor1-prod
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      # `hosting:allfor1-prod` targets the site by id (matches the manual deploy).
      - run: npx --yes firebase-tools@latest deploy --only hosting:allfor1-prod --project allfor1-prod --non-interactive
