# PR preview: builds client/ and deploys a 7-day Firebase Hosting preview
# channel of the `allfor1-prod` site, via keyless Workload Identity Federation.
# Same repo VARIABLES as the merge workflow (GCP_WIF_PROVIDER, GCP_DEPLOY_SA).
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
  id-token: write   # required for the WIF OIDC token
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd client && npm install && npm run build
      - uses: google-github-actions/auth@v2
        with:
          project_id: allfor1-prod
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - run: npx --yes firebase-tools@latest hosting:channel:deploy "pr-${{ github.event.number }}" --only allfor1-prod --project allfor1-prod --expires 7d --non-interactive
